name: PR title

# Squash merges use the PR title as the commit message, and release-please reads those messages to pick the
# next version and write the changelog. So titles must follow Conventional Commits:
#   fix: …   → patch release (0.1.0 → 0.1.1)
#   feat: …  → minor release (0.1.0 → 0.2.0)
#   feat!: … or a "BREAKING CHANGE:" footer → minor while 0.x, major from 1.0
#   docs/chore/ci/test/refactor/build/style: … → no release on their own (docs appear in the changelog)
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is safe here: this job never checks out or runs code from the PR.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            test
            build
            ci
            style
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the subject with a lowercase letter, e.g. "fix: handle empty bodies".'
