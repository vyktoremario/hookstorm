name: Release

# On every push to main, release-please keeps a "chore: release x.y.z" PR up to date: it picks the next
# version from Conventional Commit PR titles and writes the changelog. Merging that PR tags the release,
# creates a GitHub Release, and the publish job below ships it to npm via trusted publishing (OIDC: no npm
# token is stored, provenance is automatic). See docs/RELEASING.md.
#
# The publish job must stay in this file: npm's trusted publisher is configured for `release.yml` and
# environment `npm`. It also has to be in the same workflow as release-please, because tags created with
# the default GITHUB_TOKEN don't trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional RELEASE_PLEASE_TOKEN (fine-grained PAT or GitHub App token): with it, CI runs on the
          # release PR automatically. Without it, close and reopen the release PR to start CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow via OIDC
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Check the tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${{ needs.release-please.outputs.tag_name }}" ] || { echo "tag/package.json mismatch: $PKG"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
